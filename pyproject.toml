[project]
name = "physics-attractor-dynamics"
version = "0.1.0"
description = "Data-driven discovery of an unknown dynamical system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pysindy>=2.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "nbconvert>=7.17.1",
]
